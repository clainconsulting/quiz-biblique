<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17233c">
  <title>Quiz biblique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <span class="eyebrow">LOUIS SEGOND 1910</span>
      <h1>Quiz biblique</h1>
      <p>Teste tes connaissances sur toute la Bible.</p>
    </header>

    <section class="card" id="setup">
      <div class="status" id="status">Chargement de la Bible…</div>

      <label for="scope">Partie de la Bible</label>
      <select id="scope" disabled>
        <option value="all">Toute la Bible</option>
        <option value="old">Ancien Testament</option>
        <option value="new">Nouveau Testament</option>
      </select>

      <label for="difficulty">Niveau</label>
      <select id="difficulty" disabled>
        <option value="facile">Facile</option>
        <option value="intermédiaire" selected>Intermédiaire</option>
        <option value="difficile">Difficile</option>
      </select>

      <label for="count">Nombre de questions</label>
      <select id="count" disabled>
        <option value="5">5 questions</option>
        <option value="10" selected>10 questions</option>
        <option value="20">20 questions</option>
      </select>

      <button id="start" disabled>Créer mon quiz</button>
      <p class="hint">Chaque partie est créée à partir de passages choisis au hasard.</p>
    </section>

    <section class="card quiz hidden" id="quiz" aria-live="polite">
      <div class="quiz-topline">
        <span id="progress">Question 1/10</span>
        <span id="score">Score : 0</span>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <p class="question" id="question"></p>
      <div class="answers" id="answers"></div>
      <div class="feedback hidden" id="feedback"></div>
      <button class="hidden" id="next">Question suivante</button>
    </section>

    <section class="card result hidden" id="result" aria-live="polite">
      <span class="eyebrow">PARTIE TERMINÉE</span>
      <h2 id="final-score">8/10</h2>
      <p id="final-message"></p>
      <button id="update-word">Ajouter cette tentative à mon carnet Word</button>
      <button class="secondary" id="create-word">Créer un nouveau carnet Word</button>
      <input class="hidden" id="word-file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      <button id="restart">Créer un nouveau quiz</button>
    </section>
  </main>
  <script src="jszip.min.js"></script>
  <script src="word-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
